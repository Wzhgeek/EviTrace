[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evitrace"
version = "1.0.0"
description = "Evidence-guided requirements-to-code link recovery"
requires-python = ">=3.10"
dependencies = ["numpy==1.26.4", "scipy==1.12.0", "scikit-learn==1.6.1", "gensim==4.3.3", "nltk==3.9.1", "threadpoolctl>=3"]

[project.optional-dependencies]
retrieval = ["tokenizers>=0.20,<1"]
ftlr = ["pandas==2.2.3", "XlsxWriter>=3,<4"]

[project.scripts]
evitrace = "evitrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
